<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pankaj &amp; Shanu · Wardrobe Planner</title>
<meta name="description" content="What to wear: a guest style guide for Pankaj &amp; Shanu's wedding, 22 – 23 October 2026, Pushkar.">
<meta property="og:title" content="Pankaj &amp; Shanu · Wardrobe Planner">
<meta property="og:description" content="One look for her and one for him at every celebration. 22 – 23 October 2026.">
<meta name="theme-color" content="#f7f1e3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Jost','Helvetica Neue',Arial,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1c1917;overflow:hidden}
body{display:flex;justify-content:center;font-family:var(--sans);font-variant-numeric:lining-nums}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
#app{position:relative;height:100dvh;width:min(100vw,480px);container-type:inline-size;overflow:hidden;
  background:#f7f1e3;color:#4a1522;box-shadow:0 0 60px #0009;
  --cbg:#f7f1e3;--cink:#4a1522;--cacc:#7a1b2e;--cline:rgba(122,27,46,.3)}
#frame{position:absolute;inset:2.6cqw;border:1px solid var(--cline);pointer-events:none;z-index:6;transition:border-color .5s}
#frame:after{content:"";position:absolute;inset:1.2cqw;border:1px solid var(--cline);opacity:.55}

/* ---- chrome ---- */
#top{position:absolute;left:0;right:0;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:calc(4.4cqw + env(safe-area-inset-top,0px)) 6.4cqw 0;pointer-events:none;color:var(--cink);transition:color .5s}
#top>*{pointer-events:auto}
#brand{font:600 2.9cqw var(--sans);letter-spacing:.3em;text-transform:uppercase}
#listbtn{display:flex;align-items:center;gap:2cqw;font:500 2.7cqw var(--sans);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--cacc);border-radius:99px;padding:1.8cqw 3.4cqw;color:var(--cink);background:color-mix(in srgb,var(--cbg) 82%,transparent);transition:.5s}
#listbtn b{font:600 2.9cqw var(--sans);min-width:4.6cqw;height:4.6cqw;border-radius:99px;display:grid;place-items:center;background:var(--cacc);color:var(--cbg);letter-spacing:0}
#nav{position:absolute;left:0;right:0;bottom:calc(5cqw + env(safe-area-inset-bottom,0px));z-index:8;display:flex;justify-content:center;pointer-events:none}
#nav>div{pointer-events:auto;display:flex;align-items:center;gap:4cqw;padding:1.6cqw 2cqw;border-radius:99px;border:1px solid var(--cacc);background:color-mix(in srgb,var(--cbg) 90%,transparent);backdrop-filter:blur(6px);color:var(--cink);transition:.5s}
#nav .ar{width:10cqw;height:10cqw;border-radius:50%;border:1px solid var(--cline);display:grid;place-items:center;font:500 6cqw/1 var(--serif);padding-bottom:.8cqw}
#nav .ar:disabled{opacity:.28;cursor:default}
#cur{min-width:34cqw;text-align:center;font:500 2.8cqw var(--sans);letter-spacing:.2em;text-transform:uppercase}
#cur small{display:block;font:500 2.3cqw var(--sans);letter-spacing:.24em;opacity:.65;margin-top:.6cqw}

/* ---- slides ---- */
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--ink);
  padding:calc(19cqw + env(safe-area-inset-top,0px)) 8cqw 33cqw;opacity:0;visibility:hidden;transform:translateX(4cqw);
  transition:opacity .5s ease,transform .5s ease,visibility 0s .5s;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease,transform .5s ease}
.slide.out{transform:translateX(-4cqw)}
.in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4.4cqw;min-height:100%}
.in>*{max-width:100%}
.slide.on .in>*{animation:rise .7s both}
.slide.on .in>*:nth-child(2){animation-delay:.06s}.slide.on .in>*:nth-child(3){animation-delay:.12s}
.slide.on .in>*:nth-child(4){animation-delay:.18s}.slide.on .in>*:nth-child(5){animation-delay:.24s}
.slide.on .in>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(2.6cqw)}}
.eyebrow{font:500 2.7cqw/1.6 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
.ttl{font:600 12.4cqw/.98 var(--serif);letter-spacing:.005em}
.ttl.big{font-size:17cqw}
.sub{font:italic 500 5.4cqw/1.2 var(--serif);color:var(--soft);margin-top:-1.6cqw}
.tag{display:flex;align-items:center;gap:3.4cqw;width:100%;justify-content:center}
.tag:before,.tag:after{content:"";height:1px;flex:1 1 4cqw;min-width:0;background:linear-gradient(90deg,transparent,var(--acc))}
.tag:after{transform:scaleX(-1)}
.tag span{font:italic 600 5.6cqw/1.2 var(--serif);color:var(--acc);text-align:center;flex:0 1 auto;max-width:84%;text-wrap:balance}
.line{font:italic 500 4.9cqw/1.35 var(--serif);color:var(--soft);max-width:92%}
.note{font:400 3.2cqw/1.55 var(--sans);color:var(--soft);max-width:88%}
.sec{font:500 2.7cqw var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:3cqw;width:100%;justify-content:center}
.sec:before,.sec:after{content:"";height:1px;width:9cqw;background:var(--acc);opacity:.6}
.num{position:absolute;right:6cqw;top:14cqw;font:600 40cqw/1 var(--serif);color:var(--acc);opacity:.07;pointer-events:none;letter-spacing:-.02em}

/* looks */
.looks{display:grid;grid-template-columns:1fr 1fr;gap:4.4cqw;width:100%;margin-top:1cqw}
.look{transition:opacity .4s,filter .4s}
.look.dim{opacity:.32;filter:grayscale(.7)}
.arch{position:relative;display:block;width:100%;aspect-ratio:.5;border-radius:40cqw 40cqw 2.2cqw 2.2cqw;border:1px solid var(--acc);background:var(--arch);overflow:hidden;padding:0;cursor:zoom-in}
.arch:after{content:"+";position:absolute;right:2cqw;bottom:2cqw;width:6.4cqw;height:6.4cqw;border-radius:50%;background:var(--bg);color:var(--ink);font:500 4.6cqw/6cqw var(--sans);text-align:center;opacity:.9}
.arch img{position:absolute;left:0;top:7%;width:100%;height:93%;object-fit:cover;object-position:50% 0;mix-blend-mode:multiply;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 15%,#000 85%,transparent 100%),linear-gradient(180deg,transparent 0,#000 9%,#000 90%,transparent 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 15%,#000 85%,transparent 100%),linear-gradient(180deg,transparent 0,#000 9%,#000 90%,transparent 100%);mask-composite:intersect}
.arch.raw img{mix-blend-mode:normal}
.arch.svg img{inset:auto;left:7%;top:8%;width:86%;height:88%;object-fit:contain;mix-blend-mode:normal;-webkit-mask-image:none;mask-image:none}
.look figcaption{margin-top:3.2cqw;text-align:center}
.look figcaption i{display:block;font:500 2.6cqw var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--acc);font-style:normal}
.look figcaption b{display:block;font:600 5.3cqw/1.1 var(--serif);margin:1.2cqw 0 1cqw}
.look figcaption span{font:400 3.2cqw/1.45 var(--sans);color:var(--soft)}

/* palette + chips */
.pal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3.4cqw 2cqw;width:100%}
.sw{display:flex;align-items:center;gap:2cqw;text-align:left;min-width:0}
.sw i{flex:none;width:10.4cqw;height:10.4cqw;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line),inset 0 0 0 .8cqw var(--bg)}
.sw span{font:500 2.9cqw/1.25 var(--sans);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:2cqw;justify-content:center}
.chips span{font:400 3.3cqw var(--sans);border:1px solid var(--line);border-radius:99px;padding:1.8cqw 3.6cqw;color:var(--ink)}
.pack{width:100%;margin-top:1cqw;padding:3.6cqw 5cqw;border-radius:99px;border:1px solid var(--acc);color:var(--acc);font:500 3.1cqw var(--sans);letter-spacing:.2em;text-transform:uppercase;transition:.25s}
.pack.on{background:var(--acc);color:var(--bg)}
.pack:active{transform:scale(.98)}
.small{font:italic 500 3.9cqw/1.4 var(--serif);color:var(--soft)}

/* intro */
.mono{width:46cqw;height:46cqw;mix-blend-mode:multiply;margin:-2cqw 0 -3cqw;-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 71%);mask-image:radial-gradient(circle,#000 52%,transparent 71%)}
.seg{display:flex;border:1px solid var(--acc);border-radius:99px;overflow:hidden}
.seg button{font:500 3.2cqw var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:2.8cqw 6.2cqw;color:var(--acc);transition:.25s}
.seg button.a{background:var(--acc);color:var(--bg)}
.cta{font:500 3.2cqw var(--sans);letter-spacing:.26em;text-transform:uppercase;padding:3.8cqw 9cqw;border-radius:99px;background:var(--acc);color:var(--bg);box-shadow:0 .8cqw 3cqw rgba(0,0,0,.18)}
.cta:active{transform:scale(.97)}

/* overview */
.day{width:100%;text-align:left}
.day h3{font:500 2.7cqw var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--acc);padding-bottom:2.2cqw;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4cqw;width:100%;padding:3.3cqw 0;border-bottom:1px solid var(--line);text-align:left}
.row .dot{width:9cqw;height:9cqw;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.row .rn{font:600 5.2cqw/1.1 var(--serif)}
.row .rn small{display:block;font:400 3cqw var(--sans);color:var(--soft);margin-top:.8cqw}
.row em{font:500 2.9cqw var(--sans);letter-spacing:.12em;font-style:normal;color:var(--acc);text-align:right;white-space:nowrap}
.row em u{display:block;text-decoration:none;font-size:3.6cqw;margin-top:.4cqw}

/* notes */
.tips{width:100%;text-align:left}
.tip{display:grid;grid-template-columns:9cqw 1fr;gap:3.4cqw;padding:3.4cqw 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip s{text-decoration:none;font:italic 600 6cqw/1 var(--serif);color:var(--acc)}
.tip b{display:block;font:600 4.9cqw/1.15 var(--serif)}
.tip span{display:block;font:400 3.2cqw/1.5 var(--sans);color:var(--soft);margin-top:1cqw}
.sign{font:italic 600 8.4cqw/1.1 var(--serif);color:var(--acc)}

/* packing */
.bar{width:100%;height:1.4cqw;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.grp{width:100%;text-align:left;border:1px solid var(--line);border-radius:3cqw;padding:3.6cqw 4cqw;background:color-mix(in srgb,var(--bg) 60%,#fff)}
.grp h4{font:600 5.4cqw/1.1 var(--serif);display:flex;justify-content:space-between;align-items:baseline;gap:2cqw}
.grp h4 small{font:500 2.7cqw var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.it{display:flex;gap:3cqw;align-items:flex-start;padding:2.4cqw 0;border-top:1px solid var(--line);margin-top:2.4cqw;cursor:pointer}
.it+.it{margin-top:0}
.it input{position:absolute;opacity:0;pointer-events:none}
.it i{flex:none;width:5.4cqw;height:5.4cqw;border:1px solid var(--acc);border-radius:1.2cqw;display:grid;place-items:center;margin-top:.4cqw;transition:.2s}
.it input:checked+i{background:var(--acc)}
.it input:checked+i:after{content:"✓";color:var(--bg);font:600 3.6cqw/1 var(--sans)}
.it span{font:400 3.6cqw/1.4 var(--sans)}
.it span b{font-weight:500;color:var(--acc);font-size:2.6cqw;letter-spacing:.2em;text-transform:uppercase;margin-right:1.6cqw}
.it input:checked~span{opacity:.5;text-decoration:line-through}
.empty{font:italic 500 4.8cqw/1.4 var(--serif);color:var(--soft);padding:6cqw 4cqw;border:1px dashed var(--line);border-radius:3cqw;width:100%}
.btnrow{display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center;width:100%}
.ghost{font:500 2.9cqw var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:3cqw 4.6cqw;border-radius:99px;border:1px solid var(--acc);color:var(--acc);transition:.2s}
.ghost.fill{background:var(--acc);color:var(--bg)}

/* lightbox + toast */
#lb{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:10cqw 8cqw;background:color-mix(in srgb,var(--lbg,#222) 94%,#000);color:var(--link,#fff);text-align:center}
#lb.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#lb .ph{width:76%;max-height:66%;aspect-ratio:.5;border-radius:38cqw 38cqw 3cqw 3cqw;border:1px solid var(--lacc);overflow:hidden;background:var(--larch);position:relative}
#lb .ph img{position:absolute;left:0;top:6%;width:100%;height:94%;object-fit:cover;object-position:50% 0}
#lb .ph.svg img{left:7%;top:7%;width:86%;height:88%;object-fit:contain}
#lb .ph.mult img{mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%),linear-gradient(180deg,transparent 0,#000 8%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%),linear-gradient(180deg,transparent 0,#000 8%);mask-composite:intersect}
#lb h5{font:600 7cqw/1.1 var(--serif)}
#lb p{font:400 3.4cqw/1.5 var(--sans);opacity:.8}
#lb small{font:500 2.6cqw var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--lacc)}
#lb .x{position:absolute;top:calc(6cqw + env(safe-area-inset-top,0px));right:6cqw;width:10cqw;height:10cqw;border:1px solid var(--lacc);border-radius:50%;font:300 6cqw/1 var(--sans);color:var(--link)}
#toast{position:absolute;left:50%;top:calc(16cqw + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);z-index:30;background:#2b1a1f;color:#f6e9cf;font:500 3cqw var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:2.8cqw 5.4cqw;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.slide,.slide.on .in>*{transition:none;animation:none}}
</style>
</head>
<body>
<main id="app">
  <div id="frame"></div>
  <div id="top"><span id="brand">P&nbsp;❖&nbsp;S</span><button id="listbtn" aria-label="My packing list">My List <b id="cnt">0</b></button></div>
  <div id="stage"></div>
  <div id="nav"><div>
    <button class="ar" id="prev" aria-label="Previous">‹</button>
    <div id="cur"></div>
    <button class="ar" id="next" aria-label="Next">›</button>
  </div></div>
  <div id="lb" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><small id="lb-w"></small><div class="ph" id="lb-ph"><img id="lb-img" alt=""></div><h5 id="lb-t"></h5><p id="lb-d"></p></div>
  <div id="toast"></div>
</main>

 SL.push({id:f.id,label:f.title,th:f.th,html:h,fn:f});
});

var tips=[['Choose festive colours','Embrace cheerful hues, prints and traditional wear. Let your outfit reflect the joy of the occasion.'],
 ['Keep day-event outfits light and comfortable','Breezy fabrics and relaxed fits are perfect for our daytime celebrations.'],
 ['Carry a light layer for evening events','A shawl, jacket or stole will keep you comfortable as the celebrations continue into the night.'],
 ['Pair outfits with comfortable footwear','Look stylish and dance freely. Comfort goes a long way!'],
 ['Accessorize with elegance','Statement jewellery, a classic bag or a stylish watch can elevate your look beautifully.'],
 ['Most importantly, bring your smiles and good vibes','Your happiness is the best accessory of all!']];
var rom=['i','ii','iii','iv','v','vi'];
SL.push({id:'notes',label:'Style Notes',th:TH_NOTE,html:'<div class="in"><p class="eyebrow">See you in style</p><h2 class="ttl">Final<br>Style Notes</h2>'+
 '<p class="line">Thank you for being part of our celebrations.</p><div class="tips">'+
 tips.map(function(t,i){return '<div class="tip"><s>'+rom[i]+'</s><div><b>'+t[0]+'</b><span>'+t[1]+'</span></div></div>'}).join('')+'</div>'+
 '<p class="small">With love,</p><p class="sign">Pankaj &amp; Shanu</p>'+
 '<p class="note">Just a suggestion to help you pack easier, not a theme or colour compulsion.</p></div>'});

SL.push({id:'packing',label:'My Packing List',th:TH_PACK,html:'<div class="in"><p class="eyebrow">Your suitcase, sorted</p><h2 class="ttl">My Packing<br>List</h2><div id="pk" style="width:100%;display:flex;flex-direction:column;gap:4cqw;align-items:center"></div></div>'});

var stage=document.getElementById('stage');
stage.innerHTML=SL.map(function(s){return '<section class="slide" data-id="'+s.id+'" style="'+vars(s.th)+'">'+s.html+'</section>'}).join('');
var slides=[].slice.call(stage.children), cur=0, N=slides.length, PACK=N-1;

/* ---------- navigation ---------- */
var app=document.getElementById('app'),prev=document.getElementById('prev'),next=document.getElementById('next'),curEl=document.getElementById('cur');
function chrome(t){app.style.setProperty('--cbg',t.bg);app.style.setProperty('--cink',t.ink);app.style.setProperty('--cacc',t.acc);app.style.setProperty('--cline',t.line);
 app.style.background=t.bg;
 var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg}
function go(n,noHash){
 n=Math.max(0,Math.min(N-1,n));
 slides.forEach(function(s,i){s.classList.toggle('on',i===n);s.classList.toggle('out',i<n)});
 prev.disabled=n===0;next.disabled=n===N-1;
 curEl.innerHTML=esc(SL[n].label)+'<small>'+String(n+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</small>';
 chrome(SL[n].th);slides[n].scrollTop=0;cur=n;
 if(SL[n].id==='packing')renderPack();
 if(!noHash)try{history.replaceState(null,'','#'+SL[n].id)}catch(e){}
}
prev.onclick=function(){go(cur-1)};next.onclick=function(){go(cur+1)};
document.getElementById('listbtn').onclick=function(){go(PACK)};
document.addEventListener('keydown',function(e){if(document.getElementById('lb').classList.contains('show')){if(e.key==='Escape')closeLb();return}
 if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var sx=0,sy=0,t0=0;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now()},{passive:true});
document.addEventListener('touchend',function(e){if(document.getElementById('lb').classList.contains('show'))return;
 var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-t0<700)go(cur+(dx<0?1:-1))},{passive:true});

/* ---------- interactions ---------- */
document.addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
 var m=e.target.closest('#seg button');if(m){mode=m.dataset.m;save();applyMode();return}
 var p=e.target.closest('[data-pack]');if(p){var id=p.dataset.pack;if(packed[id])delete packed[id];else packed[id]=1;save();applyPacked();toast(packed[id]?'Added to your list':'Removed from your list');return}
 var l=e.target.closest('[data-lb]');if(l){openLb(l.dataset.lb);return}
});
function applyMode(){
 [].forEach.call(document.querySelectorAll('#seg button'),function(b){b.classList.toggle('a',b.dataset.m===mode)});
 [].forEach.call(document.querySelectorAll('.look'),function(l){l.classList.toggle('dim',mode!=='both'&&l.dataset.w!==mode)});
 if(SL[cur]&&SL[cur].id==='packing')renderPack();
}
function applyPacked(){
 var n=0;for(var k in packed)if(packed[k])n++;
 document.getElementById('cnt').textContent=n;
 [].forEach.call(document.querySelectorAll('.pack'),function(b){var on=!!packed[b.dataset.pack];b.classList.toggle('on',on);b.textContent=on?'✓  In my packing list':'+  Add to my packing list'});
 [].forEach.call(document.querySelectorAll('.pk'),function(u){u.textContent=packed[u.dataset.p]?'✓':''});
 if(SL[cur]&&SL[cur].id==='packing')renderPack();
}

/* ---------- lightbox ---------- */
var lb=document.getElementById('lb');
function openLb(v){
 var a=v.split('|'),f=FN[+a[0]],w=a[1],d=f[w],t=f.th;
 lb.style.setProperty('--lbg',t.bg);lb.style.setProperty('--link',t.ink);lb.style.setProperty('--lacc',t.acc);lb.style.setProperty('--larch',t.arch);
 document.getElementById('lb-w').textContent=(w==='her'?'For Her':'For Him')+' · '+f.title;
 document.getElementById('lb-img').src=IMG[f.img+'_'+w];
 document.getElementById('lb-t').textContent=d[0];document.getElementById('lb-d').textContent=d[1];
 document.getElementById('lb-ph').className='ph'+(f.svg?' svg':(f.raw?'':' mult'));
 lb.classList.add('show');
}
function closeLb(){lb.classList.remove('show')}
lb.addEventListener('click',closeLb);

/* ---------- packing list ---------- */
function items(f){
 var a=[];
 if(mode!=='him')a.push([f.id+':her','Her',f.her[0]]);
 if(mode!=='her')a.push([f.id+':him','Him',f.him[0]]);
 f.add.forEach(function(x,i){a.push([f.id+':a'+i,'Extra',x])});
 return a;
}
function renderPack(){
 var el=document.getElementById('pk'),on=FN.filter(function(f){return packed[f.id]}),tot=0,done=0,h='';
 if(!on.length){
  h='<p class="empty">Nothing here yet. Tap \u201cAdd to my packing list\u201d on any celebration, or add them all at once.</p>'+
    '<div class="btnrow"><button class="ghost fill" id="addall">Add all celebrations</button></div>';
  el.innerHTML=h;document.getElementById('addall').onclick=function(){FN.forEach(function(f){packed[f.id]=1});save();applyPacked()};return;
 }
 on.forEach(function(f){
  var it=items(f);
  h+='<div class="grp"><h4>'+esc(f.title)+'<small>'+(f.time||'Day '+f.day)+'</small></h4>'+
   it.map(function(x){tot++;var c=!!checked[x[0]];if(c)done++;
    return '<label class="it"><input type="checkbox" data-k="'+x[0]+'"'+(c?' checked':'')+'><i></i><span><b>'+x[1]+'</b>'+esc(x[2])+'</span></label>'}).join('')+'</div>';
 });
 var pct=tot?Math.round(done*100/tot):0;
 h='<p class="small">'+done+' of '+tot+' packed</p><div class="bar"><i style="width:'+pct+'%"></i></div>'+h+
  '<div class="btnrow"><button class="ghost fill" id="wa">Send to WhatsApp</button><button class="ghost" id="cp">Copy list</button></div>'+
  '<div class="btnrow"><button class="ghost" id="addall">Add all</button><button class="ghost" id="clr">Clear all</button></div>';
 el.innerHTML=h;
 [].forEach.call(el.querySelectorAll('input[data-k]'),function(c){c.onchange=function(){if(c.checked)checked[c.dataset.k]=1;else delete checked[c.dataset.k];save();
   var d=0,t=0;[].forEach.call(el.querySelectorAll('input[data-k]'),function(x){t++;if(x.checked)d++});
   el.querySelector('.small').textContent=d+' of '+t+' packed';el.querySelector('.bar i').style.width=Math.round(d*100/t)+'%'}});
 document.getElementById('addall').onclick=function(){FN.forEach(function(f){packed[f.id]=1});save();applyPacked();toast('All celebrations added')};
 document.getElementById('clr').onclick=function(){packed={};checked={};save();applyPacked()};
 function text(){
  var s='My packing list \u2728 Pankaj & Shanu\u2019s wedding, 22\u201323 Oct 2026\n';
  on.forEach(function(f){s+='\n'+f.title+(f.time?' ('+f.time+')':'')+'\n';items(f).forEach(function(x){s+=(checked[x[0]]?'[x] ':'[ ] ')+(x[1]==='Extra'?'':x[1]+': ')+x[2]+'\n'})});
  return s;
 }
 document.getElementById('wa').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(text()),'_blank')};
 document.getElementById('cp').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(text()).then(function(){toast('List copied')},function(){toast('Could not copy')});else toast('Could not copy')};
}

/* ---------- init ---------- */
applyMode();applyPacked();
var hh=(location.hash||'').slice(1),hi=SL.findIndex(function(s){return s.id===hh});
go(hi>=0?hi:0,true);
</script>
</body>
</html>
